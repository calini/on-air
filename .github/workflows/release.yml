name: Build & Release

on:
  push:
    branches: ["master"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["master"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: make generate

      - name: Build
        run: xcodebuild -project OnAir.xcodeproj -scheme OnAir -configuration Debug build CODE_SIGNING_ALLOWED=NO

      # No test target yet. Once one exists, add a step here, e.g.:
      #   xcodebuild -project OnAir.xcodeproj -scheme OnAir -configuration Debug test CODE_SIGNING_ALLOWED=NO

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build (ad-hoc signed)
        run: make release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" OnAir.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
